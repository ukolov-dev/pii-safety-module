services:
  api:
    build:
      context: ..
    environment:
      REDIS_URL: redis://redis:6379/0
      MAPPING_ENCRYPTION_KEY: ${MAPPING_ENCRYPTION_KEY:?persistent key required}
      PARTNER_API_KEY: ${PARTNER_API_KEY:?consumer key required}
      CONSUMERS_CONFIG: /app/config/consumers.yaml
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - ./consumers.vps.yaml:/app/config/consumers.yaml:ro
    networks:
      default:
      monitoring:
        aliases: [pii-safety-api]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 256mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  monitoring:
    external: true
    name: monitoring_monitoring
