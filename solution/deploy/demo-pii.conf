server {
    listen 443 ssl;
    server_name demo.vibecodefromvoronezh.com;
    ssl_certificate /etc/letsencrypt/live/demo.vibecodefromvoronezh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.vibecodefromvoronezh.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 12m;
    location = / { return 302 /docs; }
    location = /metrics { return 404; }
    location ~ ^/(process|docs|openapi.json|health/live|health/ready)$ {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        access_log off;
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name demo.vibecodefromvoronezh.com;
    return 301 https://$host$request_uri;
}
