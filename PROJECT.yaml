project:
  name: База знаний для сбора требований к проекту (хакатон)
  purpose: Сбор, извлечение и подготовка требований к проекту в рамках хакатона
  status: обработка сырых данных завершена
structure:
  .project-context/active: Единая база исходных материалов, требований, регламента
    и подготовленных документов
  .project-context/SOURCE_MAP.md: Соответствие исторических путей записям контекста
  RAW: PDF-источник, не включённый в текстовый импорт
  solution: Сервис, тесты, конфигурация запуска и результаты проверок
  playbooks: Процедуры работы
data_flow:
- from: Новые источники
  to: .project-context/active
  action: Извлечение и уточнение знаний
- from: .project-context/active
  to: .project-context/active/requirements
  action: Подготовка документов
rules:
- Требования не выдумываются — только извлекаются из исходников
- Каждый факт обязан иметь источник (ссылка на RAW/ или database/)
- Новое обсуждение не отменяет утвержденное требование автоматически
- Оригиналы сохраняй, существующие изменения не затирай
- Удалять файлы из проекта запрещено
- current_specification.md всегда содержит актуальные требования; перед изменением
  предыдущая редакция сохраняется отдельным неизменяемым снимком
context_window:
  limit_tokens: 1000000
  notes:
  - Стартовый контекст держи небольшим; подробности загружай по задаче
  - Учитывай место под инструкции, историю и ответы инструментов
entry_points:
- START_HERE.md — порядок работы
- AGENTS.md — правила работы
- .project-context/SOURCE_MAP.md — расположение материалов
- solution/README.md — запуск и тестирование
session_handoff:
- 'Перед сменой сессии сохраняй: результат, незавершенное, следующий шаг'
- Обновляй database/current_context.md
